# =============================================================================
# LogiFlow.Api on Kubernetes — the part the Dockerfile deliberately leaves out.
#
#     kubectl apply -f deploy/k8s/
#
# Module 13's golden rule 11 says "liveness dependency-free, readiness not —
# same rule as module 11, this time in the orchestrator's YAML". This file is
# that YAML, and it is here so the rule is readable rather than only stated.
#
# It is not a production manifest. There is no Ingress, no TLS, no resource
# quota tuned against real traffic and no HorizontalPodAutoscaler, because each
# of those depends on a cluster nobody reading this shares. What it does show
# is the four decisions that are the same everywhere and that people get wrong:
# the two probes, the secret, the non-root security context, and migrations as
# a Job rather than a startup step.
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: logiflow

---
# ── Configuration ────────────────────────────────────────────────────────────
# The shape lives here; the values that matter do not. Note the `__` — the same
# nesting convention the docker launch profile uses, because it is .NET's, not
# Docker's. ConnectionStrings__SqlServer overrides ConnectionStrings:SqlServer.
apiVersion: v1
kind: ConfigMap
metadata:
  name: logiflow-config
  namespace: logiflow
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ConnectionStrings__Redis: "redis:6379"
  Otlp__Endpoint: "http://otel-collector:4317"
  Mailing__Transport: "Smtp"
  Mailing__Smtp__Host: "mailpit"
  Mailing__Smtp__Port: "1025"

---
# A Secret, so the two values that must never appear in a repository have a
# place to be. Kubernetes Secrets are base64, NOT encrypted, and anyone who can
# read the namespace can read them — which is why the real answer is a CSI
# driver backed by Key Vault or Secrets Manager, and why this file ships empty:
#
#   kubectl create secret generic logiflow-secrets --namespace logiflow \
#     --from-literal=ConnectionStrings__SqlServer='Server=...' \
#     --from-literal=Jwt__SigningKey="$(openssl rand -base64 48)"
#
# Covered in: course/module-13-deployment/02-configuration.md
apiVersion: v1
kind: Secret
metadata:
  name: logiflow-secrets
  namespace: logiflow
type: Opaque
stringData: {}

---
# ── Migrations: a Job, not a startup step ────────────────────────────────────
# Three replicas starting at once means three processes running EF migrations
# against one database at the same time. They race, and the loser's failure mode
# is not always a clean error. So the schema change is its own step, it runs
# once, and it runs BEFORE the new pods — which is also the only ordering in
# which "expand, migrate, contract" means anything.
#
# The image here is the SDK one because `dotnet ef` is a tool, not part of the
# app. In a real pipeline you would instead generate an idempotent .sql script
# at build time and have a human read it — EF sometimes decides a rename is a
# drop-and-recreate, and that is not a thing to discover in production.
apiVersion: batch/v1
kind: Job
metadata:
  name: logiflow-migrate
  namespace: logiflow
  annotations:
    # Run before the Deployment on `kubectl apply`, if you use a tool that
    # honours hooks (Helm, Argo CD). Plain kubectl does not order manifests.
    helm.sh/hook: pre-upgrade,pre-install
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: logiflow-api:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Apply the idempotent script generated at build time:"
              echo "  dotnet ef migrations script --idempotent --output migrate.sql"
              echo "  sqlcmd -S \$SERVER -i migrate.sql"
              echo "This Job is where that runs. See module 13 section 3."
          envFrom:
            - configMapRef: { name: logiflow-config }
            - secretRef: { name: logiflow-secrets }

---
# ── The application ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logiflow-api
  namespace: logiflow
spec:
  replicas: 3
  selector:
    matchLabels: { app: logiflow-api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below the current capacity mid-deploy
      maxSurge: 1
  template:
    metadata:
      labels: { app: logiflow-api }
    spec:
      # The image already runs as UID 1654 (see the Dockerfile). Saying so again
      # here means the cluster enforces it even if somebody rebuilds the image
      # without the USER line — defence in depth, and it is what a Pod Security
      # Standard of `restricted` requires anyway.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
        seccompProfile: { type: RuntimeDefault }

      containers:
        - name: api
          image: logiflow-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          envFrom:
            - configMapRef: { name: logiflow-config }
            - secretRef: { name: logiflow-secrets }

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }

          # readOnlyRootFilesystem means the process cannot write anywhere it is
          # not given a volume. .NET wants a temp directory; give it an emptyDir
          # rather than turning the flag off.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          # ── The two probes, which are not the same question ────────────────
          #
          # LIVENESS: "is this process wedged?" It must depend on NOTHING
          # external. If it checked the database, a database blip would make
          # Kubernetes restart every healthy pod in the deployment at once —
          # turning a recoverable outage into a total one. That failure has a
          # name and people have caused it.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # READINESS: "should this pod receive traffic right now?" This one
          # SHOULD check the database, because a pod that cannot reach SQL Server
          # can only return errors. Failing readiness takes it out of the Service
          # endpoints; it does not restart it, so it rejoins by itself when the
          # dependency returns.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # STARTUP: the one that makes the other two safe on a slow first boot.
          # Without it, initialDelaySeconds has to be padded to cover the worst
          # cold start, which then delays detection of a genuinely wedged process
          # for the whole life of the pod. 30 × 5s = up to 150 seconds to start,
          # after which liveness takes over at its own brisk interval.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30

          # Requests are what the scheduler packs against; limits are what gets
          # you OOM-killed. For .NET, memory limit also configures the GC — the
          # runtime reads the cgroup limit and sizes the heap from it.
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { memory: "512Mi" }

          # In-flight requests need time to finish before the process goes away.
          # Kubernetes removes the pod from the Service and sends SIGTERM at the
          # same moment, so this sleep covers the propagation delay — otherwise a
          # small number of requests are routed to a pod that is already exiting.
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 5"] }

      terminationGracePeriodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: logiflow-api
  namespace: logiflow
spec:
  selector: { app: logiflow-api }
  ports:
    - port: 80
      targetPort: http
      name: http
